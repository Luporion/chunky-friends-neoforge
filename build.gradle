plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ChunkyFriends-NeoForge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'CodeMC'
        url = 'https://repo.codemc.io/repository/maven-public/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Chunky Friends uses Chunky's stable 1.4.x developer API on Minecraft 1.21.1.
    compileOnly "org.popcraft:chunky-common:${project.chunky_version}"

    // Makes ./gradlew runServer usable without manually copying Chunky into the dev run directory.
    // LuFhm4eU is Chunky-NeoForge-1.4.23 for Minecraft 1.21-1.21.1.
    localRuntime "maven.modrinth:fALzjamp:LuFhm4eU"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ModDevGradle supplies Gson and SLF4J to the mod compile/runtime environment, but the plain
    // Gradle JUnit test runtime does not inherit every Minecraft/NeoForge library automatically.
    // ChunkyFriendsConfig initializes both classes statically, so make those test-runtime
    // dependencies explicit. They are not bundled into the production mod JAR.
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            chunky_version          : chunky_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Keep the license in the binary JAR. Do not reference `project` from a
// rename closure here: Gradle 9.x executes that closure during the task and
// rejects the build when configuration cache is enabled.
tasks.named('jar', Jar) {
    from('LICENSE')
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
